
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso | Nissan Chatbot</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --red: #c8102e;
            --red-light: #ed2344;
            --white: #ffffff;
            --muted: #aeb9c6;
            --panel: rgba(12, 17, 24, 0.88);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #080d12;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--white);
            background: #080d12;
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(
                    90deg,
                    rgba(3, 7, 12, 0.48) 0%,
                    rgba(3, 7, 12, 0.20) 55%,
                    rgba(3, 7, 12, 0.30) 100%
                ),
                url("/images/nissan-fondo.jpg") center / cover no-repeat;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 25%,
                rgba(0, 0, 0, 0.18) 100%
            );
        }

        .accent-line {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 4px;
            background: var(--red);
            box-shadow: 0 0 20px rgba(200, 16, 46, 0.45);
            z-index: 5;
        }

        .page {
            width: 100%;
            max-width: 390px;
            margin: auto;
            animation: appear 0.5s ease both;
        }

        .brand {
            text-align: center;
            margin-bottom: 23px;
        }

        .brand-icon {
            width: 57px;
            height: 57px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: linear-gradient(145deg, #e21a3b, #a50725);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 26px rgba(200, 16, 46, 0.3);
        }

        .brand-icon i {
            font-size: 25px;
            color: white;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(23px, 4vw, 29px);
            font-weight: 750;
            letter-spacing: 3px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
        }

        .brand h1 span {
            color: #ff3856;
        }

        .brand p {
            margin: 9px 0 0;
            color: #e1e7ed;
            font-size: 13px;
            line-height: 1.5;
            text-shadow: 0 2px 8px #000;
        }

        .card {
            padding: 30px 28px 23px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 18px;
            box-shadow:
                0 24px 65px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .card-heading {
            text-align: center;
            margin-bottom: 26px;
        }

        .card-heading h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
        }

        .card-heading p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            color: #e5eaf0;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9daab9;
            font-size: 16px;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            height: 53px;
            padding: 0 49px 0 44px;
            border: 1px solid rgba(190, 205, 220, 0.28);
            border-radius: 10px;
            outline: none;
            background: rgba(2, 6, 11, 0.72);
            color: white;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap input::placeholder {
            color: #8e9baa;
        }

        .input-wrap input:focus {
            border-color: var(--red-light);
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 29px;
            height: 32px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #aeb9c6;
            font-size: 15px;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: white;
        }

        .submit {
            width: 100%;
            height: 53px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: linear-gradient(110deg, #e51b3d, #b70928);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 23px rgba(200, 16, 46, 0.23);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }

        .submit i {
            font-size: 14px;
            transition: transform 0.2s;
        }

        .submit:hover {
            filter: brightness(1.08);
            box-shadow: 0 11px 29px rgba(200, 16, 46, 0.35);
            transform: translateY(-1px);
        }

        .submit:hover i {
            transform: translateX(3px);
        }

        .submit:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid rgba(240, 80, 100, 0.4);
            border-radius: 9px;
            color: #ffc0ca;
            background: rgba(200, 16, 46, 0.15);
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.visible {
            display: block;
        }

        .message i {
            margin-right: 7px;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 20px;
            color: #b8c3cf;
            font-size: 11px;
        }

        .security-note i {
            color: #7fc7a1;
        }

        .footer {
            margin-top: 21px;
            text-align: center;
            color: #e0e6ed;
            font-size: 10px;
            letter-spacing: 1px;
            text-shadow: 0 2px 7px #000;
        }

        .footer span {
            margin: 0 7px;
            color: #ff3856;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(9px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
            }

            .page {
                max-width: 360px;
            }

            .brand {
                margin-bottom: 18px;
            }

            .brand-icon {
                width: 49px;
                height: 49px;
                border-radius: 14px;
                margin-bottom: 10px;
            }

            .brand-icon i {
                font-size: 22px;
            }

            .brand h1 {
                font-size: 23px;
                letter-spacing: 2px;
            }

            .brand p {
                font-size: 12px;
            }

            .card {
                padding: 25px 20px 20px;
            }

            .card-heading h2 {
                font-size: 20px;
            }

            .footer {
                font-size: 9px;
            }

            .footer span {
                margin: 0 4px;
            }
        }

        @media (max-height: 650px) {
            body {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .brand {
                margin-bottom: 10px;
            }

            .brand-icon {
                width: 40px;
                height: 40px;
                margin-bottom: 5px;
                border-radius: 11px;
            }

            .brand-icon i {
                font-size: 18px;
            }

            .brand p {
                margin-top: 4px;
            }

            .card {
                padding-top: 18px;
                padding-bottom: 15px;
            }

            .card-heading {
                margin-bottom: 17px;
            }

            .field {
                margin-bottom: 12px;
            }

            .security-note {
                margin-top: 12px;
            }

            .footer {
                margin-top: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="accent-line" aria-hidden="true"></div>

    <main class="page">
        <header class="brand">
            <div class="brand-icon" aria-hidden="true">
                <i class="fa-solid fa-car-side"></i>
            </div>

            <h1>NISSAN <span>CHATBOT</span></h1>
            <p>Panel de administración y gestión</p>
        </header>

        <section class="card">
            <div class="card-heading">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Correo electrónico</label>

                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope input-icon"
                           aria-hidden="true"></i>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="usuario@empresa.com"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>

                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"
                           aria-hidden="true"></i>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            class="toggle-password"
                            type="button"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                            title="Mostrar contraseña"
                        >
                            <i class="fa-regular fa-eye"
                               aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button class="submit" type="submit" id="submitButton">
                    <span id="buttonText">Iniciar sesión</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>

                <div
                    class="message"
                    id="message"
                    role="alert"
                    aria-live="polite"
                ></div>
            </form>

            <div class="security-note">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                <span>Acceso seguro al sistema</span>
            </div>
        </section>

        <footer class="footer">
            Innovación <span>•</span> Conectividad <span>•</span> Servicio
        </footer>
    </main>

    <script>
        "use strict";

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const submitButton = document.getElementById("submitButton");
        const buttonText = document.getElementById("buttonText");
        const message = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");

        // Mostrar mensajes en el formulario.
        function showMessage(text) {
            if (!message) {
                alert(text);
                return;
            }

            message.replaceChildren();

            const icon = document.createElement("i");
            icon.className = "fa-solid fa-circle-exclamation";
            icon.setAttribute("aria-hidden", "true");

            message.appendChild(icon);
            message.appendChild(document.createTextNode(" " + text));
            message.classList.add("visible");
        }

        // Mostrar u ocultar la contraseña.
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener("click", function () {
                const mostrar = passwordInput.type === "password";
                const icon = this.querySelector("i");

                passwordInput.type = mostrar ? "text" : "password";

                if (icon) {
                    icon.className = mostrar
                        ? "fa-regular fa-eye-slash"
                        : "fa-regular fa-eye";
                }

                this.setAttribute(
                    "aria-label",
                    mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
                );

                this.title = mostrar
                    ? "Ocultar contraseña"
                    : "Mostrar contraseña";
            });
        }

        // Enviar las credenciales al servidor.
        if (form) {
            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                if (!emailInput || !passwordInput || !submitButton) {
                    showMessage(
                        "No se encontraron todos los campos del formulario."
                    );
                    return;
                }

                const correo = emailInput.value.trim();
                const password = passwordInput.value;

                if (!correo || !password) {
                    showMessage("Escribe tu correo y contraseña.");
                    return;
                }

                message.classList.remove("visible");
                message.textContent = "";

                submitButton.disabled = true;
                buttonText.textContent = "Verificando...";

                try {
                    const response = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        cache: "no-store",
                        body: JSON.stringify({
                            correo: correo,
                            password: password
                        })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        showMessage(
                            data.error ||
                            data.message ||
                            "No se pudo iniciar sesión. Verifica tus datos."
                        );
                        return;
                    }

                    // Comprobar que el servidor devolvió un usuario.
                    if (!data.usuario) {
                        showMessage(
                            "El servidor no devolvió los datos del usuario. Revisa la respuesta del servidor."
                        );
                        return;
                    }

                    // Avisar al dashboard que el login acaba de realizarse.
                    sessionStorage.setItem("nissan_login_navigation", "1");

                    // Entrar al panel de administración.
                    window.location.replace("/dashboard.html");

                } catch (error) {
                    console.error("Error de inicio de sesión:", error);

                    showMessage(
                        "No se pudo conectar con el servidor. Comprueba que esté funcionando."
                    );
                } finally {
                    submitButton.disabled = false;
                    buttonText.textContent = "Iniciar sesión";
                }
            });
        } else {
            console.error(
                'No se encontró el formulario con id="loginForm".'
            );
        }
    </script>
</body>
</html>
