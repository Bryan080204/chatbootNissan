<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/admin-nissan.css">
    <link rel="stylesheet" href="/css/admin-app.css">
</head>
<body class="app-body" data-page="chats">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="/img/nissan-logo.jpg" alt="Nissan" class="sidebar-logo">
                <div class="sidebar-brand-text">
                    <div class="sidebar-brand-name">Nissan Oaxaca</div>
                    <div class="sidebar-brand-sub">Agencia</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a class="nav-link active" href="/admin/chats"><i class="fa-solid fa-comments"></i> Chats</a>
                <a class="nav-link" href="/admin/citas"><i class="fa-solid fa-calendar-check"></i> Citas</a>
                <a class="nav-link" href="/admin/usuarios"><i class="fa-solid fa-users-gear"></i> Administradores</a>
                <a class="nav-link" href="/admin/config"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar">ADM</div>
                    <div class="user-meta">
                        <div class="user-name">Administrador</div>
                        <div class="user-role">Administración</div>
                    </div>
                </div>
                <a href="/" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
            </div>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-left">
                    <div>
                        <div class="topbar-title">Chats</div>
                        <div class="topbar-subtitle">Monitor y respuesta a conversaciones del chatbot</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="topbar-pill"><i class="fa-solid fa-circle" style="color:var(--verde);"></i> Chatbot en línea</div>
                </div>
            </header>
            <main class="main-content">
                <div class="whatsapp-shell">
                    <aside class="chat-list-panel">
                        <div class="chat-list-header">
                            <h2>Conversaciones</h2>
                            <span class="chat-count" id="chatCount">0 chats</span>
                        </div>
                        <div class="chat-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="chatSearch" placeholder="Buscar por nombre, teléfono o mensaje...">
                        </div>
                        <div class="chat-filters" id="chatFilters">
                            <button type="button" class="chip active" data-filter="todos"><i class="fa-solid fa-inbox"></i> Todos</button>
                            <button type="button" class="chip" data-filter="pendiente"><i class="fa-solid fa-clock"></i> Pendientes</button>
                            <button type="button" class="chip" data-filter="confirmada"><i class="fa-solid fa-circle-check"></i> Confirmadas</button>
                            <button type="button" class="chip" data-filter="cancelada"><i class="fa-solid fa-ban"></i> Canceladas</button>
                        </div>
                        <div class="chat-items" id="chatList"></div>
                    </aside>

                    <section class="conversation-panel">
                        <div class="conversation-header">
                            <div class="conversation-user">
                                <div class="chat-avatar" id="convAvatar">--</div>
                                <div class="conversation-meta">
                                    <h3 id="convName">Selecciona una conversación</h3>
                                    <div class="conversation-status" id="convStatus">En línea</div>
                                </div>
                            </div>
                            <div class="conversation-actions">
                                <button type="button" class="icon-btn"><i class="fa-solid fa-phone"></i></button>
                                <button type="button" class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </div>
                        </div>
                        <div class="messages-area" id="messagesArea"></div>
                        <div class="reply-area">
                            <div class="reply-input-wrap">
                                <i class="fa-solid fa-paperclip"></i>
                                <input type="text" id="replyInput" placeholder="Escribe un mensaje para responder al cliente...">
                                <div class="reply-actions">
                                    <i class="fa-regular fa-face-smile"></i>
                                    <i class="fa-solid fa-microphone"></i>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:flex-end;">
                                <button type="button" class="btn-send" id="btnSend" title="Enviar mensaje"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </section>

                    <aside class="info-panel">
                        <div class="info-section">
                            <div class="info-header"><h4>Información del Cliente</h4></div>
                            <div id="clientInfoBody"></div>
                        </div>
                    </aside>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
