<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Login Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/frontend.css">
</head>
<body class="login-body">
    <div class="login-bg-glow login-bg-glow--red"></div>
    <div class="login-bg-glow login-bg-glow--dark"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-card-accent"></div>

            <div class="login-header">
                <div class="login-logo-wrap login-logo-wrap--sm">
                    <img src="/img/nissan-logo.jpg" alt="Nissan" class="login-logo">
                </div>
                <h1 class="login-title">Panel de Usuario</h1>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <form class="login-form" onsubmit="event.preventDefault(); window.location.href='/admin/dashboard';">
                <div class="form-group">
                    <label class="form-label" for="email"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="usuario@nissan.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="input-toggle" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-row">
                    <label class="login-remember"><input type="checkbox"> Recordarme</label>
                    <a href="#" class="login-link-muted">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-btn login-btn--user">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>

            <div class="login-alt">
                <span>¿Eres administrador?</span>
                <a href="/admin/login"><i class="fa-solid fa-shield-halved"></i> Ir al Panel Admin</a>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var toggle = document.getElementById('togglePassword');
            var password = document.getElementById('password');
            if (!toggle || !password) return;
            toggle.addEventListener('click', function () {
                var show = password.type === 'password';
                password.type = show ? 'text' : 'password';
                toggle.innerHTML = show
                    ? '<i class="fa-regular fa-eye-slash"></i>'
                    : '<i class="fa-regular fa-eye"></i>';
                toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        })();
    </script>
</body>
</html>
