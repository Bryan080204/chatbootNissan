<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Configuración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/admin-nissan.css">
</head>
<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="/img/nissan-logo.jpg" alt="Nissan" class="sidebar-logo">
                <div class="sidebar-brand-text">
                    <div class="sidebar-brand-name">Nissan Oaxaca</div>
                    <div class="sidebar-brand-sub">Agencia</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-link" href="/admin/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a class="nav-link" href="/admin/chats"><i class="fa-solid fa-comments"></i> Chats</a>
                <a class="nav-link" href="/admin/citas"><i class="fa-solid fa-calendar-check"></i> Citas</a>
                <a class="nav-link" href="/admin/usuarios"><i class="fa-solid fa-users-gear"></i> Administradores</a>
                <a class="nav-link active" href="/admin/config"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar">ADM</div>
                    <div class="user-meta">
                        <div class="user-name">Administrador</div>
                        <div class="user-role">Administración</div>
                    </div>
                </div>
                <a href="/" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
            </div>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <div class="topbar-left">
                    <div>
                        <div class="topbar-title">Configuración</div>
                        <div class="topbar-subtitle">Cambio de contraseña y ajustes visuales</div>
                    </div>
                </div>
            </header>
            <main class="main-content" style="max-width: 720px;">
                <div class="conversation-panel">
                    <div class="conversation-header">
                        <div class="conversation-user">
                            <div class="chat-avatar"><i class="fa-solid fa-key"></i></div>
                            <div class="conversation-meta">
                                <h3>Cambiar Contraseña</h3>
                                <div class="conversation-status" style="color: var(--gris-texto);"><i class="fa-solid fa-lock"></i> Solo para administradores</div>
                            </div>
                        </div>
                    </div>
                    <div class="messages-area" style="flex-direction: column; align-items: stretch;">
                        <form style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label class="form-label-alt">Contraseña Actual</label>
                                <div class="input-group">
                                    <i class="fa-solid fa-lock"></i>
                                    <input type="password" placeholder="Ingresa tu contraseña actual">
                                </div>
                            </div>
                            <div class="form-field">
                                <label class="form-label-alt">Nueva Contraseña</label>
                                <div class="input-group">
                                    <i class="fa-solid fa-key"></i>
                                    <input type="password" placeholder="Ingresa nueva contraseña">
                                </div>
                            </div>
                            <div class="form-field">
                                <label class="form-label-alt">Confirmar Nueva Contraseña</label>
                                <div class="input-group">
                                    <i class="fa-solid fa-key"></i>
                                    <input type="password" placeholder="Repite la nueva contraseña">
                                </div>
                            </div>
                            <div style="display: flex; justify-content: flex-end;">
                                <button type="button" class="btn-primary" style="border-radius: 12px; padding: 12px 26px; box-shadow: none;"><i class="fa-solid fa-floppy-disk"></i> Guardar Cambios (Visual)</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
