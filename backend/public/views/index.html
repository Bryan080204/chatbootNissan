<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Interfaz Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/frontend.css">
</head>
<body class="login-body">
    <main class="login-wrapper login-wrapper--wide">
        <div class="login-card login-card--wide">
            <div class="login-header">
                <div class="login-logo-wrap">
                    <img src="/img/nissan-logo.jpg" alt="Nissan" class="login-logo">
                </div>
                <h1 class="login-title">Interfaz Chatbot Nissan</h1>
                <p class="login-subtitle">Sistema de atención y gestión para Agencia Nissan Oaxaca</p>
            </div>

            <div class="login-options">
                <a href="/login" class="panel-option panel-option--user">
                    <span class="panel-option-icon"><i class="fa-solid fa-user"></i></span>
                    <span class="panel-option-body">
                        <strong>Panel de Usuario</strong>
                        <small>Consulta y atención de clientes</small>
                    </span>
                    <i class="fa-solid fa-arrow-right panel-option-arrow"></i>
                </a>

                <a href="/admin/login" class="panel-option panel-option--admin">
                    <span class="panel-option-icon"><i class="fa-solid fa-shield-halved"></i></span>
                    <span class="panel-option-body">
                        <strong>Panel de Administración</strong>
                        <small>Control total del sistema</small>
                    </span>
                    <i class="fa-solid fa-arrow-right panel-option-arrow"></i>
                </a>
            </div>

            <div class="login-secure">
                <i class="fa-solid fa-lock"></i> Acceso seguro y profesional
            </div>
        </div>
    </main>
</body>
</html>
